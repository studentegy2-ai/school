  <script type="module">
    import { initializeApp, deleteApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { getFirestore, doc, getDoc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    const DEFAULT_CLOUD_CONFIG = {
      apiKey: "AIzaSyB0mLiz2d7sykD1qLgrdCpYpkxzsRH9ONc",
      authDomain: "sadfa-school-portal.firebaseapp.com",
      projectId: "sadfa-school-portal",
      storageBucket: "sadfa-school-portal.firebasestorage.app",
      messagingSenderId: "611998394999",
      appId: "1:611998394999:web:605b87bb42578972ec3472"
    };

    const envRawConfig = typeof __firebase_config !== 'undefined' ? __firebase_config : '';
    const appId = typeof __app_id !== 'undefined' ? __app_id : 'sadfa_school_portal_v2026_11_22';
    const CUSTOM_CLOUD_KEY = 'sadfa_custom_cloud_config_v1';

    let activeUnsubscribe = null;
    let activeFbApp = null;

    window.cloudSync = window.cloudSync || {
      enabled: false,
      ready: false,
      modeLabel: 'محلي',
      saveToCloud: async function() {},
      updateStatusBadge: function() {},
      reinit: async function() {}
    };

    function resolveActiveFirebaseConfig() {
      try {
        const savedCustom = localStorage.getItem(CUSTOM_CLOUD_KEY);
        if (savedCustom && savedCustom.trim()) {
          const parsedCustom = JSON.parse(savedCustom);
          if (parsedCustom && parsedCustom.apiKey && parsedCustom.projectId) {
            return { config: parsedCustom, source: 'custom' };
          }
        }
      } catch (e) {
        console.warn('Invalid custom cloud config in storage:', e);
      }

      if (envRawConfig) {
        try {
          const parsedEnv = JSON.parse(envRawConfig);
          if (parsedEnv && parsedEnv.apiKey) {
            return { config: parsedEnv, source: 'env' };
          }
        } catch (e) {
          console.warn('Invalid environment cloud config:', e);
        }
      }

      if (DEFAULT_CLOUD_CONFIG && DEFAULT_CLOUD_CONFIG.apiKey && DEFAULT_CLOUD_CONFIG.projectId) {
        return { config: DEFAULT_CLOUD_CONFIG, source: 'embedded' };
      }

      return null;
    }

    async function initCloudSync() {
      if (activeUnsubscribe) {
        try { activeUnsubscribe(); } catch (_) {}
        activeUnsubscribe = null;
      }

      const resolved = resolveActiveFirebaseConfig();
      if (!resolved) {
        window.cloudSync.enabled = false;
        window.cloudSync.ready = false;
        if (typeof window.cloudSync.updateStatusBadge === 'function') {
          window.cloudSync.updateStatusBadge('local');
        }
        return false;
      }

      try {
        if (activeFbApp) {
          try { await deleteApp(activeFbApp); } catch (_) {}
          activeFbApp = null;
        }

        const appInstanceName = 'sadfa_sync_' + Date.now();
        activeFbApp = initializeApp(resolved.config, appInstanceName);
        const auth = getAuth(activeFbApp);
        const db = getFirestore(activeFbApp);
        const portalDocRef = doc(db, 'artifacts', appId, 'public', 'data', 'school_portal_state', 'main_record');

        if (resolved.source === 'env' && typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
          await signInWithCustomToken(auth, __initial_auth_token);
        } else {
          await signInAnonymously(auth);
        }

        if (!auth.currentUser) {
          window.cloudSync.enabled = false;
          if (typeof window.cloudSync.updateStatusBadge === 'function') {
            window.cloudSync.updateStatusBadge('error');
          }
          return false;
        }

        window.cloudSync.enabled = true;
        window.cloudSync.ready = true;
        window.cloudSync.modeLabel = resolved.source === 'custom' ? 'سحابي خارجي' : 'سحابي فوري';

        if (typeof window.cloudSync.updateStatusBadge === 'function') {
          window.cloudSync.updateStatusBadge('synced');
        }

        window.cloudSync.saveToCloud = async function(stateObj) {
          if (!auth.currentUser) return;
          try {
            if (typeof window.cloudSync.updateStatusBadge === 'function') {
              window.cloudSync.updateStatusBadge('saving');
            }
            const sanitized = JSON.parse(JSON.stringify(stateObj));
            await setDoc(portalDocRef, {
              payload: JSON.stringify(sanitized),
              updatedAt: Date.now()
            }, { merge: true });
            if (typeof window.cloudSync.updateStatusBadge === 'function') {
              window.cloudSync.updateStatusBadge('synced');
            }
          } catch (err) {
            console.error('Cloud save error:', err);
            if (typeof window.cloudSync.updateStatusBadge === 'function') {
              window.cloudSync.updateStatusBadge('error');
            }
          }
        };

        const initialSnap = await getDoc(portalDocRef);
        if (initialSnap.exists() && initialSnap.data() && initialSnap.data().payload) {
          try {
            const remoteParsed = JSON.parse(initialSnap.data().payload);
            if (typeof window.applyRemotePortalState === 'function') {
              window.applyRemotePortalState(remoteParsed);
            }
          } catch (e) {
            console.error('Error parsing initial cloud state:', e);
          }
        } else if (typeof window.getLocalPortalState === 'function') {
          await window.cloudSync.saveToCloud(window.getLocalPortalState());
        }

        activeUnsubscribe = onSnapshot(
          portalDocRef,
          (snap) => {
            if (!snap.exists() || !snap.data() || !snap.data().payload) return;
            try {
              const remoteState = JSON.parse(snap.data().payload);
              if (typeof window.applyRemotePortalState === 'function') {
                window.applyRemotePortalState(remoteState);
              }
              if (typeof window.cloudSync.updateStatusBadge === 'function') {
                window.cloudSync.updateStatusBadge('synced');
              }
            } catch (e) {
              console.error('Realtime snapshot parse error:', e);
            }
          },
          (err) => {
            console.error('Realtime snapshot error:', err);
            if (typeof window.cloudSync.updateStatusBadge === 'function') {
              window.cloudSync.updateStatusBadge('error');
            }
          }
        );

        return true;
      } catch (err) {
        console.error('Cloud initialization error:', err);
        window.cloudSync.enabled = false;
        if (typeof window.cloudSync.updateStatusBadge === 'function') {
          window.cloudSync.updateStatusBadge('error');
        }
        return false;
      }
    }

    window.cloudSync.reinit = initCloudSync;
    initCloudSync();
  </script>

    function loadState() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) {
          const parsed = JSON.parse(saved);
          parsed.settings = { ...DEFAULT_STATE.settings, ...(parsed.settings || {}) };
          parsed.subTeachers = Array.isArray(parsed.subTeachers) ? parsed.subTeachers : [];
          parsed.monthlyExams = parsed.monthlyExams || {};
          parsed.grades = parsed.grades || {};
          parsed.attendance = parsed.attendance || {};
          parsed.contents = parsed.contents || [];
          parsed.classes = (parsed.classes && parsed.classes.length > 0 ? parsed.classes : DEFAULT_STATE.classes).map(c => ({
            ...c,
            gradeLevel: c.gradeLevel || 'الصف الأول الثانوي'
          }));
          parsed.students = parsed.students || [];
          return parsed;
        }
      } catch (e) {
        console.error('Error loading state from localStorage:', e);
      }
      return JSON.parse(JSON.stringify(DEFAULT_STATE));
    }

    let appData = loadState();

    function getLocalPortalState() {

    function parseGradeToken(rawVal) {
      if (rawVal === null || rawVal === undefined) return { type: 'empty', num: 0, display: '' };
      const str = String(rawVal).trim();
      if (str === '') return { type: 'empty', num: 0, display: '' };
      if (str === 'غ' || str === 'غائب') return { type: 'absent', num: 0, display: 'غ' };
      if (str === 'صفر') return { type: 'number', num: 0, display: 'صفر' };
      const normalized = str.replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d));
      const num = Number(normalized);
      if (!isNaN(num)) {
        return { type: 'number', num: num, display: num === 0 && str === 'صفر' ? 'صفر' : String(num) };
      }
      return { type: 'invalid', num: 0, display: str };
    }

    function getWeekSundayToThursdayDays(studyStartDateStr, weekNumber) {
      const dayNames = ['الأحد', 'الإثنين', 'الثلاثاء', 'الأربعاء', 'الخميس'];
      if (!studyStartDateStr) {
        return dayNames.map((name) => ({ dayName: name, isoDate: '', shortDate: '' }));
      }
      const parts = studyStartDateStr.split('-').map(Number);
      const base = new Date(parts[0], parts[1] - 1, parts[2]);
      if (isNaN(base.getTime())) {
        return dayNames.map(name => ({ dayName: name, isoDate: '', shortDate: '' }));
      }
      const dow = base.getDay();
      if (dow !== 6) {
        base.setDate(base.getDate() - (dow + 1));
      }
      base.setDate(base.getDate() + (weekNumber - 1) * 7 + 1);

      return dayNames.map((name, idx) => {
        const d = new Date(base);
        d.setDate(base.getDate() + idx);
        const y = d.getFullYear();
        const m = String(d.getMonth() + 1).padStart(2, '0');
        const day = String(d.getDate()).padStart(2, '0');
        return {
          dayName: name,
          isoDate: `${y}-${m}-${day}`,
          shortDate: `${day}/${m}`
        };
      });
    }

    function sortStudentsAlphabetically(studentsList) {
      return [...studentsList].sort((a, b) => a.name.localeCompare(b.name, 'ar'));

    function getWeekSaturdayDate(studyStartDateStr, weekNumber) {
      if (!studyStartDateStr) return '';
      const parts = studyStartDateStr.split('-').map(Number);
      if (parts.length !== 3) return '';
      const date = new Date(parts[0], parts[1] - 1, parts[2]);
      if (isNaN(date.getTime())) return '';

      const dayOfWeek = date.getDay();
      if (dayOfWeek !== 6) {
        const diffToSaturday = dayOfWeek + 1;
        date.setDate(date.getDate() - diffToSaturday);
      }

      date.setDate(date.getDate() + (weekNumber - 1) * 7);

      const y = date.getFullYear();
      const m = String(date.getMonth() + 1).padStart(2, '0');
      const d = String(date.getDate()).padStart(2, '0');
      return `${y}/${m}/${d}`;
    }

      const map = {
        classwork: { label: 'الأداء الصفي', badge: 'bg-blue-100 text-blue-800', icon: 'book-open' },
        homework: { label: 'الواجب المنزلي', badge: 'bg-emerald-100 text-emerald-800', icon: 'pen-tool' },
        quiz: { label: 'التقييم الأسبوعي', badge: 'bg-amber-100 text-amber-800', icon: 'award' }
      };
      return map[type] || map.classwork;
    }

    /*************************************************************************
     * 3. منطق الحسابات الأكاديمية (متوسطات الفصل الدراسي الأول من 1 إلى 18 + الشهور)
     *************************************************************************/
    function calculateStudentTermSummary(studentId) {
      let quizSum = 0, quizCount = 0;
      let hwSum = 0, hwCount = 0;
      let behSum = 0, behCount = 0;

      ALL_WEEKS.forEach(w => {
        const rec = appData.grades[`${studentId}_${w}`];
        if (rec) {
          const qTok = parseGradeToken(rec.quiz);
          if (qTok.type === 'number') {
            quizSum += qTok.num;
            quizCount++;
          }
          const hTok = parseGradeToken(rec.hw);
          if (hTok.type === 'number') {
            hwSum += hTok.num;
            hwCount++;
          }
          const bTok = parseGradeToken(rec.behavior);
          if (bTok.type === 'number') {
            behSum += bTok.num;
            behCount++;
          }
        }
      });

      const quizAvg = quizCount > 0 ? Number((quizSum / quizCount).toFixed(2)) : 0;
      const hwAvg = hwCount > 0 ? Number((hwSum / hwCount).toFixed(2)) : 0;
      const behAvg = behCount > 0 ? Number((behSum / behCount).toFixed(2)) : 0;
      const totalFinal = Number((quizAvg + hwAvg + behAvg).toFixed(2));
      const hasAnyGrade = quizCount > 0 || hwCount > 0 || behCount > 0;

      const exams = appData.monthlyExams[studentId] || { oct: null, nov: null };
      const octTok = parseGradeToken(exams.oct);
      const novTok = parseGradeToken(exams.nov);
      const octVal = octTok.type === 'number' ? octTok.num : (octTok.type === 'absent' ? 'غ' : null);
      const novVal = novTok.type === 'number' ? novTok.num : (novTok.type === 'absent' ? 'غ' : null);
      const hasAnyExam = octTok.type === 'number' || novTok.type === 'number' || octTok.type === 'absent' || novTok.type === 'absent';
      const examsTotal = Number(((octTok.type === 'number' ? octTok.num : 0) + (novTok.type === 'number' ? novTok.num : 0)).toFixed(2));

      return {
        quizSum, quizCount, quizAvg,
        hwSum, hwCount, hwAvg,
        behSum, behCount, behAvg,
        totalFinal, hasAnyGrade,
        octVal, novVal, hasAnyExam, examsTotal
      };
    }

    function getStudentAttendanceStats(studentId, classId) {
      let present = 0, absent = 0, excused = 0;
      Object.entries(appData.attendance).forEach(([key, records]) => {
        if (key.startsWith(`${classId}_`) && records[studentId]) {
          if (records[studentId] === 'present') present++;
          else if (records[studentId] === 'absent') absent++;
          else if (records[studentId] === 'excused') excused++;
        }
      });
      const totalDays = present + absent + excused;
      const rate = totalDays > 0 ? Math.round(((present + excused) / totalDays) * 100) : 100;
      return { present, absent, excused, totalDays, rate };
    }

    function triggerImmediatePrint() {
      const box = document.getElementById('printable-sheet-box');
      if (!box) {
        window.print();
        return;
      }

      let printZone = document.getElementById('dedicated-print-zone');
      if (!printZone) {
        printZone = document.createElement('div');
        printZone.id = 'dedicated-print-zone';
        document.body.appendChild(printZone);
      }

      const appEl = document.getElementById('app');
      const modalBackdrop = document.getElementById('modal-backdrop');

      printZone.innerHTML = `<div class="print-container" dir="rtl">${box.outerHTML}</div>`;
      if (appEl) appEl.classList.add('no-print');
      if (modalBackdrop) modalBackdrop.classList.add('no-print');

      setTimeout(() => {
        window.print();
        setTimeout(() => {
          if (appEl) appEl.classList.remove('no-print');
          if (modalBackdrop) modalBackdrop.classList.remove('no-print');
          if (printZone) printZone.innerHTML = '';
        }, 400);
      }, 100);
    }

    function exportOfficialSheetPDF(weekNumbers, rangeTitle, includeTermAvgAndExams) {
      const s = appData.settings;
      const profile = getActiveTeacherProfile();
      const currentClass = appData.classes.find(c => c.id === uiState.selectedClassId) || appData.classes[0];
      const classStudents = sortStudentsAlphabetically(
        appData.students.filter(st => st.classId === uiState.selectedClassId)
      );

      showToast('جاري إنشاء ملف PDF عالي الدقة...', 'info');

      try {
        const scale = 2.5;
        const pageW = 1240;
        const pageH = 1754;

        const canvas = document.createElement('canvas');
        canvas.width = pageW * scale;
        canvas.height = pageH * scale;
        const ctx = canvas.getContext('2d');
        ctx.scale(scale, scale);
        ctx.direction = 'rtl';

        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, pageW, pageH);

        const marginX = 36;
        const marginY = 36;
        const usableW = pageW - marginX * 2;

        ctx.fillStyle = '#0f172a';
        ctx.textAlign = 'right';
        ctx.font = 'bold 17px Cairo, sans-serif';
        ctx.fillText(s.directorate, pageW - marginX, marginY + 18);
        ctx.font = 'bold 16px Cairo, sans-serif';
        ctx.fillText(s.administration, pageW - marginX, marginY + 42);
        ctx.fillText(s.schoolName, pageW - marginX, marginY + 66);

        const centerX = pageW / 2;
        ctx.textAlign = 'center';
        ctx.font = 'bold 20px Cairo, sans-serif';
        ctx.fillStyle = '#1e3a8a';
        ctx.fillText(`سجل رصد درجات ${currentClass.fullName} — مادة ${profile ? profile.subjectName : s.subjectName}`, centerX, marginY + 24);

        ctx.font = 'bold 14px Cairo, sans-serif';
        ctx.fillStyle = '#334155';
        ctx.fillText(`${rangeTitle} • العام الدراسي ${s.academicYear}`, centerX, marginY + 48);

        ctx.textAlign = 'left';
        ctx.font = 'bold 14px Cairo, sans-serif';
        ctx.fillStyle = '#0f172a';
        ctx.fillText(currentClass.gradeLevel || s.gradeLevel, marginX, marginY + 20);
        ctx.fillText(`عدد الطلاب: ${classStudents.length}`, marginX, marginY + 44);

        const headerBottomY = marginY + 84;
        ctx.strokeStyle = '#0f172a';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(marginX, headerBottomY);
        ctx.lineTo(pageW - marginX, headerBottomY);
        ctx.stroke();

        const targetWeeks = weekNumbers.map(w => ({
          num: w,
          label: getArabicWeekOrdinal(w),
          date: getWeekSaturdayDate(s.studyStartDate, w)
        }));

        const columns = [];
        const seqW = 30;
        const nameW = includeTermAvgAndExams ? 215 : 275;

        columns.push({ width: seqW, type: 'seq', title: 'م' });
        columns.push({ width: nameW, type: 'name', title: 'الاسم' });

        targetWeeks.forEach((w, idx) => {
          const subW = includeTermAvgAndExams ? 37 : 44;
          columns.push({ width: subW, type: 'week_sub', weekNum: w.num, field: 'quiz', topGroup: `${w.label} (${w.date})`, subTitle: 'تقييم', maxLabel: '15', weekStart: idx === 0, isWeekBoundary: true });
          columns.push({ width: subW, type: 'week_sub', weekNum: w.num, field: 'hw', topGroup: '', subTitle: 'واجب', maxLabel: '15' });
          columns.push({ width: subW, type: 'week_sub', weekNum: w.num, field: 'behavior', topGroup: '', subTitle: 'سلوك', maxLabel: '10' });
          columns.push({ width: subW, type: 'week_total', weekNum: w.num, topGroup: '', subTitle: 'المجموع', maxLabel: '40', bg: '#f1f5f9' });
        });

        if (includeTermAvgAndExams) {
          const avgW = 36;
          columns.push({ width: avgW, type: 'avg_quiz', topGroup: 'متوسط الفصل الأول', subTitle: 'تقييم', maxLabel: '15', isWeekBoundary: true, bg: '#ecfdf5' });
          columns.push({ width: avgW, type: 'avg_hw', topGroup: '', subTitle: 'واجب', maxLabel: '15', bg: '#ecfdf5' });
          columns.push({ width: avgW, type: 'avg_beh', topGroup: '', subTitle: 'سلوك', maxLabel: '10', bg: '#ecfdf5' });
          columns.push({ width: avgW, type: 'avg_total', topGroup: '', subTitle: 'المجموع', maxLabel: '40', bg: '#a7f3d0' });

          const exW = 38;
          columns.push({ width: exW, type: 'exam_oct', topGroup: 'اختبارات الشهور', subTitle: 'أكتوبر', maxLabel: '15', isWeekBoundary: true, bg: '#fffbeb' });
          columns.push({ width: exW, type: 'exam_nov', topGroup: '', subTitle: 'نوفمبر', maxLabel: '15', bg: '#fffbeb' });
          columns.push({ width: exW, type: 'exam_total', topGroup: '', subTitle: 'المجموع', maxLabel: '30', bg: '#fde68a' });
        }

        const rawSumW = columns.reduce((acc, c) => acc + c.width, 0);
        const ratio = usableW / rawSumW;
        columns.forEach(c => {
          c.width = c.width * ratio;
        });

        const tableTopY = headerBottomY + 12;
        const r1H = 30;
        const r2H = 24;
        const r3H = 20;
        const headTotalH = r1H + r2H + r3H;

        let curX = pageW - marginX;
        let idxCol = 0;
        while (idxCol < columns.length) {
          const col = columns[idxCol];
          const xLeft = curX - col.width;

          if (col.type === 'seq' || col.type === 'name') {
            ctx.fillStyle = '#e2e8f0';
            ctx.fillRect(xLeft, tableTopY, col.width, headTotalH);
            ctx.strokeStyle = '#0f172a';
            ctx.lineWidth = col.type === 'name' ? 2.2 : 1.2;
            ctx.strokeRect(xLeft, tableTopY, col.width, headTotalH);

            ctx.fillStyle = '#0f172a';
            ctx.textAlign = 'center';
            ctx.font = 'bold 14px Cairo, sans-serif';
            ctx.fillText(col.title, xLeft + col.width / 2, tableTopY + headTotalH / 2 + 5);

            curX = xLeft;
            idxCol++;
          } else {
            // تحديد عدد الأعمدة المدمجة في الترويسة العلوية (4 للأسبوع أو المتوسط، 3 للاختبارات)
            const spanCount = col.type === 'exam_oct' ? 3 : 4;
            let groupW = 0;
            for (let k = 0; k < spanCount && (idxCol + k) < columns.length; k++) {
              groupW += columns[idxCol + k].width;
            }
            const groupLeftX = curX - groupW;

            // رسم الخانة العلوية المدمجة بالكامل بدون خطوط تقسيم داخلية
            ctx.fillStyle = col.bg || '#dbeafe';
            ctx.fillRect(groupLeftX, tableTopY, groupW, r1H);
            ctx.strokeStyle = '#0f172a';
            ctx.lineWidth = 2.2;
            ctx.strokeRect(groupLeftX, tableTopY, groupW, r1H);

            ctx.fillStyle = '#0f172a';
            ctx.textAlign = 'center';
            ctx.font = 'bold 11.5px Cairo, sans-serif';
            ctx.fillText(col.topGroup || '', groupLeftX + groupW / 2, tableTopY + 19);

            // رسم الصف الثاني والثالث الفرعيين لكل عمود داخل المجموعة
            let subCurX = curX;
            for (let k = 0; k < spanCount && (idxCol + k) < columns.length; k++) {
              const subCol = columns[idxCol + k];
              const subLeft = subCurX - subCol.width;

              ctx.fillStyle = subCol.bg || '#f8fafc';
              ctx.fillRect(subLeft, tableTopY + r1H, subCol.width, r2H);
              ctx.strokeStyle = '#0f172a';
              ctx.lineWidth = 1;
              ctx.strokeRect(subLeft, tableTopY + r1H, subCol.width, r2H);

              ctx.fillStyle = subCol.bg || '#f1f5f9';
              ctx.fillRect(subLeft, tableTopY + r1H + r2H, subCol.width, r3H);
              ctx.strokeRect(subLeft, tableTopY + r1H + r2H, subCol.width, r3H);

              ctx.fillStyle = '#0f172a';
              ctx.textAlign = 'center';
              ctx.font = 'bold 9.5px Cairo, sans-serif';
              ctx.fillText(subCol.subTitle, subLeft + subCol.width / 2, tableTopY + r1H + 16);

              ctx.font = 'bold 10.5px Cairo, sans-serif';
              ctx.fillStyle = '#1e3a8a';
              ctx.fillText(subCol.maxLabel, subLeft + subCol.width / 2, tableTopY + r1H + r2H + 14);

              subCurX = subLeft;
            }

            // رسم إطار خارجي سميك للمجموعة بالكامل لتمييز الحدود الفاصلة بين الأسابيع
            ctx.strokeStyle = '#0f172a';
            ctx.lineWidth = 2.2;
            ctx.strokeRect(groupLeftX, tableTopY, groupW, headTotalH);

            curX = groupLeftX;
            idxCol += spanCount;
          }
        }

        // تمديد ارتفاع صفوف الطلاب لتمتلئ كامل الصفحة حتى التذييل دون ترك ربع الصفحة فارغاً
        const bodyTopY = tableTopY + headTotalH;
        const footerAreaH = 65;
        const availableBodyH = pageH - bodyTopY - footerAreaH;
        const rowH = Math.min(72, Math.max(32, Math.floor(availableBodyH / Math.max(1, classStudents.length))));

        classStudents.forEach((student, idx) => {
          const yRow = bodyTopY + idx * rowH;
          const summary = includeTermAvgAndExams ? calculateStudentTermSummary(student.id) : null;
          const exams = appData.monthlyExams[student.id] || { oct: null, nov: null };

          let xCursor = pageW - marginX;
          columns.forEach(col => {
            const xLeft = xCursor - col.width;
            ctx.fillStyle = col.bg || (idx % 2 === 0 ? '#ffffff' : '#f8fafc');
            ctx.fillRect(xLeft, yRow, col.width, rowH);
            ctx.strokeStyle = '#0f172a';
            ctx.lineWidth = col.isWeekBoundary ? 2.2 : 1;
            ctx.strokeRect(xLeft, yRow, col.width, rowH);

            ctx.fillStyle = '#0f172a';
            let textVal = '';

            if (col.type === 'seq') {
              ctx.textAlign = 'center';
              ctx.font = 'bold 12px Cairo, sans-serif';
              textVal = String(idx + 1);
              ctx.fillText(textVal, xLeft + col.width / 2, yRow + rowH / 2 + 4);
            } else if (col.type === 'name') {
              // قصّ الرسم داخل حدود عمود الاسم والتفاف الاسم الطويل على سطرين لمنع أي تداخل نهائياً
              ctx.save();
              ctx.beginPath();
              ctx.rect(xLeft + 3, yRow + 2, col.width - 6, rowH - 4);
              ctx.clip();

              ctx.textAlign = 'right';
              const fontSize = includeTermAvgAndExams ? 11.5 : 13;
              ctx.font = `bold ${fontSize}px Cairo, sans-serif`;
              const maxTextW = col.width - 12;
              const fullName = student.name;

              if (ctx.measureText(fullName).width <= maxTextW || rowH < 38) {
                ctx.fillText(fullName, xLeft + col.width - 6, yRow + rowH / 2 + 4);
              } else {
                const words = fullName.split(' ');
                let line1 = '';
                let line2 = '';
                for (let i = 0; i < words.length; i++) {
                  const testLine = line1 ? `${line1} ${words[i]}` : words[i];
                  if (ctx.measureText(testLine).width <= maxTextW) {
                    line1 = testLine;
                  } else {
                    line2 = words.slice(i).join(' ');
                    break;
                  }
                }
                if (line2) {
                  ctx.fillText(line1, xLeft + col.width - 6, yRow + rowH / 2 - 4);
                  ctx.fillText(line2, xLeft + col.width - 6, yRow + rowH / 2 + 12);
                } else {
                  ctx.fillText(line1, xLeft + col.width - 6, yRow + rowH / 2 + 4);
                }
              }
              ctx.restore();
            } else if (col.type === 'week_sub') {
              const rec = appData.grades[`${student.id}_${col.weekNum}`] || {};
              const tok = parseGradeToken(rec[col.field]);
              textVal = tok.display;
              ctx.textAlign = 'center';
              ctx.fillStyle = tok.type === 'absent' ? '#dc2626' : '#0f172a';
              ctx.font = 'bold 11.5px Cairo, sans-serif';
              ctx.fillText(textVal, xLeft + col.width / 2, yRow + rowH / 2 + 4);
            } else if (col.type === 'week_total') {
              const rec = appData.grades[`${student.id}_${col.weekNum}`] || {};
              const qTok = parseGradeToken(rec.quiz);
              const hTok = parseGradeToken(rec.hw);
              const bTok = parseGradeToken(rec.behavior);
              const hasAny = qTok.type !== 'empty' || hTok.type !== 'empty' || bTok.type !== 'empty';
              textVal = hasAny ? String(Number((qTok.num + hTok.num + bTok.num).toFixed(2))) : '-';
              ctx.textAlign = 'center';
              ctx.font = 'bold 12px Cairo, sans-serif';
              ctx.fillText(textVal, xLeft + col.width / 2, yRow + rowH / 2 + 4);
            } else if (col.type === 'avg_quiz' && summary) {
              textVal = summary.quizCount > 0 ? String(summary.quizAvg) : '-';
              ctx.textAlign = 'center';
              ctx.font = 'bold 11px Cairo, sans-serif';
              ctx.fillText(textVal, xLeft + col.width / 2, yRow + rowH / 2 + 4);
            } else if (col.type === 'avg_hw' && summary) {
              textVal = summary.hwCount > 0 ? String(summary.hwAvg) : '-';
              ctx.textAlign = 'center';
              ctx.font = 'bold 11px Cairo, sans-serif';
              ctx.fillText(textVal, xLeft + col.width / 2, yRow + rowH / 2 + 4);
            } else if (col.type === 'avg_beh' && summary) {
              textVal = summary.behCount > 0 ? String(summary.behAvg) : '-';
              ctx.textAlign = 'center';
              ctx.font = 'bold 11px Cairo, sans-serif';
              ctx.fillText(textVal, xLeft + col.width / 2, yRow + rowH / 2 + 4);
            } else if (col.type === 'avg_total' && summary) {
              textVal = summary.hasAnyGrade ? String(summary.totalFinal) : '-';
              ctx.textAlign = 'center';
              ctx.font = 'bold 11.5px Cairo, sans-serif';
              ctx.fillText(textVal, xLeft + col.width / 2, yRow + rowH / 2 + 4);
            } else if (col.type === 'exam_oct') {
              textVal = (exams.oct !== null && exams.oct !== undefined && exams.oct !== '') ? String(exams.oct) : '-';
              ctx.textAlign = 'center';
              ctx.font = 'bold 11px Cairo, sans-serif';
              ctx.fillText(textVal, xLeft + col.width / 2, yRow + rowH / 2 + 4);
            } else if (col.type === 'exam_nov') {
              textVal = (exams.nov !== null && exams.nov !== undefined && exams.nov !== '') ? String(exams.nov) : '-';
              ctx.textAlign = 'center';
              ctx.font = 'bold 11px Cairo, sans-serif';
              ctx.fillText(textVal, xLeft + col.width / 2, yRow + rowH / 2 + 4);
            } else if (col.type === 'exam_total' && summary) {
              textVal = summary.hasAnyExam ? String(summary.examsTotal) : '-';
              ctx.textAlign = 'center';
              ctx.font = 'bold 11.5px Cairo, sans-serif';
              ctx.fillText(textVal, xLeft + col.width / 2, yRow + rowH / 2 + 4);
            }

            xCursor = xLeft;
          });
        });

        const footerY = pageH - 36;
        ctx.strokeStyle = '#0f172a';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(marginX, footerY - 24);
        ctx.lineTo(pageW - marginX, footerY - 24);
        ctx.stroke();

        ctx.fillStyle = '#0f172a';
        ctx.font = 'bold 17px Cairo, sans-serif';
        ctx.textAlign = 'right';
        ctx.fillText(`معلم المادة / ${profile ? profile.name : s.teacherName}`, pageW - marginX, footerY);

        ctx.textAlign = 'left';
        ctx.fillText(`مدير المدرسة / ${s.principalName}`, marginX, footerY);

        const imgDataUrl = canvas.toDataURL('image/png', 1.0);
        const fileName = `كشف_درجات_${currentClass.name.replace('/', '-')}_أسبوع_${weekNumbers[0]}_إلى_${weekNumbers[weekNumbers.length - 1]}.pdf`;

        if (window.jspdf && window.jspdf.jsPDF) {
          const { jsPDF } = window.jspdf;
          const pdf = new jsPDF({
            orientation: 'portrait',
            unit: 'mm',
            format: 'a4'
          });
          pdf.addImage(imgDataUrl, 'PNG', 0, 0, 210, 297);
          pdf.save(fileName);
          showToast('تم تصدير ملف PDF بنجاح بجميع البيانات!', 'success');
        } else {
          const link = document.createElement('a');
          link.href = imgDataUrl;
          link.download = fileName.replace('.pdf', '.png');
          link.click();
          showToast('تم حفظ الكشف بدقة طباعة عالية بنجاح', 'success');
        }
      } catch (err) {
        console.error('PDF export error:', err);
        showToast('حدث خطأ أثناء توليد ملف PDF، جرّب الطباعة المباشرة.', 'error');
      }
    }

    function handleLogin(e) {
      e.preventDefault();
      const username = document.getElementById('login-username').value.trim();
      const password = document.getElementById('login-password').value.trim();
      authenticate(username, password);
    }

    function authenticate(username, password) {
      const s = appData.settings;
      if (username === s.teacherUsername && password === s.teacherPassword) {
        uiState.currentUser = { role: 'teacher', isSuperAdmin: true };
        uiState.teacherTab = 'students';
        uiState.printCardsMode = false;
        if (appData.classes.length > 0) {
          uiState.selectedGradeLevel = appData.classes[0].gradeLevel || 'الصف الأول الثانوي';
          uiState.selectedClassId = appData.classes[0].id;
        }
        showToast(`مرحباً بك يا ${s.teacherName} (الحساب الرئيسي)`, 'success');
        renderApp();
        return;
      }

      const subTeacher = (appData.subTeachers || []).find(t => t.username === username && t.password === password);
      if (subTeacher) {
        const allowedClasses = appData.classes.filter(c => (subTeacher.classIds || []).includes(c.id));
        if (allowedClasses.length === 0) {
          showToast('لم يتم تخصيص فصول لحسابك بعد، يرجى التواصل مع مدير المنصة.', 'warning');
          return;
        }
        uiState.currentUser = { role: 'teacher', isSuperAdmin: false, subTeacherId: subTeacher.id };
        uiState.teacherTab = 'students';
        uiState.printCardsMode = false;
        uiState.selectedGradeLevel = allowedClasses[0].gradeLevel || 'الصف الأول الثانوي';
        uiState.selectedClassId = allowedClasses[0].id;
        showToast(`مرحباً بك يا ${subTeacher.name}`, 'success');
        renderApp();
        return;
      }

      const student = appData.students.find(st => st.username === username && st.password === password);
      if (student) {
        uiState.currentUser = { role: 'student', studentId: student.id };
        uiState.studentViewMode = 'content';
        uiState.studentTab = 'classwork';
        uiState.studentDate = TODAY;
        showToast(`أهلاً بك يا ${student.name}`, 'success');
        renderApp();
        return;
      }

      showToast('اسم المستخدم أو كلمة المرور غير صحيحة!', 'error');
    }

    function logout() {
      uiState.currentUser = null;
      uiState.printCardsMode = false;
      renderApp();
    }

            <div class="rounded-2xl overflow-hidden border border-slate-200 bg-slate-50">
              <img src="${item.attachmentPreview}" alt="${item.attachmentName}" class="w-full h-auto object-contain max-h-96 mx-auto"
                onerror="this.src='https://placehold.co/600x350/eff6ff/1e40af?text=%D9%85%D8%B9%D8%A7%D9%8A%D9%86%D8%A9+%D8%A7%D9%84%D9%85%D8%B1%D9%81%D9%82'" />

                <i data-lucide="file-check-2" class="w-8 h-8"></i>
              </div>
              <div class="font-bold text-slate-900">${item.attachmentName || item.title}</div>
              ${item.attachmentUrl ? `
                <a href="${item.attachmentUrl}" target="_blank" rel="noopener noreferrer"
                  class="inline-flex items-center gap-1.5 text-xs font-bold text-brand-700 underline">
                  <i data-lucide="external-link" class="w-3.5 h-3.5"></i>
                  <span>فتح رابط الملف الخارجي</span>

              ` : `

                  مرفق خاص بـ "${item.title}" من إعداد ${appData.settings.teacherName}.
                </p>
              `}
            </div>
          `}
          <button onclick="downloadAttachmentFile('${item.id}')"
            class="w-full py-3 bg-brand-700 hover:bg-brand-800 text-white font-bold rounded-2xl flex items-center justify-center gap-2 text-sm">
            <i data-lucide="download" class="w-4 h-4"></i>
            <span>تحميل المرفق</span>
          </button>
        </div>
      `);
    }

    function downloadAttachmentFile(contentId) {
      const item = appData.contents.find(c => c.id === contentId);
      if (!item) return;
      if (item.attachmentPreview && item.attachmentPreview.startsWith('data:')) {
        const a = document.createElement('a');
        a.href = item.attachmentPreview;
        a.download = item.attachmentName || 'attachment.png';
        a.click();
      } else if (item.attachmentUrl) {
        window.open(item.attachmentUrl, '_blank', 'noopener,noreferrer');
      } else {
        const s = appData.settings;
        const textBlob = new Blob(
          [`${s.schoolName}\nالمادة: ${s.subjectName}\nالمعلم: ${s.teacherName}\nالعنوان: ${item.title}\nالتاريخ: ${item.date}\n\n${item.description}`],
          { type: 'text/plain;charset=utf-8' }
        );
        const url = URL.createObjectURL(textBlob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `${item.title}.txt`;
        a.click();
        URL.revokeObjectURL(url);
      }
      showToast('تم تنفيذ التحميل بنجاح', 'success');
      forceCloseModal();
    }

      const currentIdx = REPORT_SHEETS_CONFIG.findIndex(sh => sh.id === uiState.selectedSheetId);

      const nextIdx = safeIdx + step;
      if (nextIdx >= 0 && nextIdx < REPORT_SHEETS_CONFIG.length) {
        selectReportSheet(REPORT_SHEETS_CONFIG[nextIdx].id);

    function saveBasicDataPage(e) {
      e.preventDefault();
      const directorate = document.getElementById('basic-directorate').value.trim();
      const administration = document.getElementById('basic-administration').value.trim();
      const schoolName = document.getElementById('basic-school').value.trim();
      const teacherName = document.getElementById('basic-teacher').value.trim();
      const teacherTitle = document.getElementById('basic-teacher-title').value.trim();
      const whatsappNumber = document.getElementById('basic-whatsapp').value.trim();
      const subjectName = document.getElementById('basic-subject').value.trim();
      const gradeLevel = document.getElementById('basic-grade').value.trim();
      const principalName = document.getElementById('basic-principal').value.trim();
      const academicYear = document.getElementById('basic-year').value.trim();
      const studyStartDate = document.getElementById('basic-start-date').value;
      const teacherUsername = document.getElementById('basic-username').value.trim();
      const teacherPassword = document.getElementById('basic-password').value.trim();

      if (appData.students.some(st => st.username === teacherUsername) || (appData.subTeachers || []).some(t => t.username === teacherUsername)) {
        showToast('اسم مستخدم المعلم يتعارض مع مستخدم آخر مسجل!', 'error');
        return;
      }

      appData.settings = {
        ...appData.settings,
        directorate,
        administration,
        schoolName,
        teacherName,
        teacherTitle,
        whatsappNumber,
        subjectName,
        gradeLevel,
        principalName,
        academicYear,
        studyStartDate,
        teacherUsername,
        teacherPassword
      };

      saveState();
      showToast('تم حفظ البيانات الأساسية وتطبيقها في جميع الكشوف والصفحات!', 'success');
      renderApp();
    }

    function generateNextStudentCode(classId, extraReservedCodes = []) {
      const classIndex = appData.classes.findIndex(c => c.id === classId);
      const prefix = classIndex >= 0 ? (classIndex + 1) * 1000 : 1000;
      const allCodes = [
        ...appData.students.map(s => parseInt(s.username, 10)),
        ...extraReservedCodes.map(c => parseInt(c, 10))
      ].filter(n => !isNaN(n) && n >= prefix && n < prefix + 999);
      const maxCode = allCodes.length > 0 ? Math.max(...allCodes) : prefix;
      return String(maxCode + 1);
    }

    function generateRandomPassword() {
      return String(Math.floor(1000 + Math.random() * 9000));
    }

    function parseBulkStudentsInput(rawText, classId, defaultPassMode) {
      if (!rawText || !rawText.trim()) return [];
      const lines = rawText
        .split(/\r?\n/)
        .map(line => line.trim())
        .filter(line => line.length > 0);

      const parsed = [];
      const reservedCodes = [];

      lines.forEach((line, index) => {
        let cols = [];
        if (line.includes('\t')) {
          cols = line.split('\t').map(c => c.trim());
        } else if (line.includes(';')) {
          cols = line.split(';').map(c => c.trim());
        } else if (line.includes(',')) {
          cols = line.split(',').map(c => c.trim());
        } else {
          cols = [line.trim()];
        }

        const name = cols[0] || '';
        if (!name) return;

        if (
          index === 0 &&
          (name === 'الاسم' || name === 'اسم الطالب' || name.toLowerCase() === 'name')
        ) {
          return;
        }

        let rawCode = cols[1] ? cols[1].trim() : '';
        let rawPass = cols[2] ? cols[2].trim() : '';

        let codeSource = 'excel';
        let status = 'valid';
        let statusNote = 'جاهز';

        if (!rawCode) {
          rawCode = generateNextStudentCode(classId, reservedCodes);
          codeSource = 'auto';
        }

        const isDuplicateInSystem =
          appData.students.some(s => s.username === rawCode) ||
          rawCode === appData.settings.teacherUsername;
        const isDuplicateInBatch = reservedCodes.includes(rawCode);

        if (isDuplicateInSystem || isDuplicateInBatch) {
          status = 'duplicate';
          statusNote = isDuplicateInSystem ? 'كود مسجل مسبقاً' : 'كود مكرر بالجدول';
        } else {
          reservedCodes.push(rawCode);
        }

        let passSource = 'excel';
        if (!rawPass) {
          if (defaultPassMode === 'same_code') {
            rawPass = rawCode;
          } else if (defaultPassMode === 'random') {
            rawPass = generateRandomPassword();
          } else {
            rawPass = '1234';
          }
          passSource = 'auto';
        }

        parsed.push({
          name,
          username: rawCode,
          password: rawPass,
          codeSource,
          passSource,
          status,
          statusNote
        });
      });

      return parsed;
    }

    function saveEditedClass(e, classId) {
      e.preventDefault();
      const gradeLevel = document.getElementById('edit-cls-grade').value;
      const name = document.getElementById('edit-cls-short').value.trim();
      const fullName = document.getElementById('edit-cls-full').value.trim();
      const idx = appData.classes.findIndex(c => c.id === classId);
      if (idx !== -1) {
        appData.classes[idx] = { ...appData.classes[idx], gradeLevel, name, fullName };
        uiState.selectedGradeLevel = gradeLevel;
        saveState();
        forceCloseModal();
        showToast('تم تعديل اسم الفصل بنجاح', 'success');
        renderApp();
      }
    }

    function handleAddClass(e) {
      e.preventDefault();
      const shortName = document.getElementById('new-class-short').value.trim();
      const fullName = document.getElementById('new-class-full').value.trim();
      if (!shortName || !fullName) return;

      const newId = 'c_' + Date.now();
      appData.classes.push({
        id: newId,
        name: shortName,
        fullName,
        gradeLevel: uiState.selectedGradeLevel || 'الصف الأول الثانوي'
      });
      uiState.selectedClassId = newId;
      saveState();
      showToast(`تم إنشاء (${fullName}) في ${uiState.selectedGradeLevel} بنجاح`, 'success');
      renderApp();
    }

    function deleteEmptyClass(classId) {
      const hasStudents = appData.students.some(s => s.classId === classId);
      if (hasStudents) {
        showToast('لا يمكن حذف فصل يحتوي على طلاب', 'error');
        return;
      }
      appData.classes = appData.classes.filter(c => c.id !== classId);
      if (uiState.selectedClassId === classId) {
        uiState.selectedClassId = appData.classes[0].id;
      }
      saveState();
      showToast('تم حذف الفصل الفارغ', 'info');
      renderApp();
    }

    function handleAddStudent(e) {
      e.preventDefault();
      const name = document.getElementById('new-student-name').value.trim();
      const username = document.getElementById('new-student-user').value.trim();
      const password = document.getElementById('new-student-pass').value.trim();

      if (appData.students.some(s => s.username === username) || username === appData.settings.teacherUsername) {
        showToast('اسم المستخدم هذا مستخدم بالفعل، اختر كوداً آخر.', 'error');
        return;
      }

      appData.students.push({
        id: 's_' + Date.now(),
        username,
        password,
        name,
        classId: uiState.selectedClassId
      });
      saveState();
      showToast(`تمت إضافة الطالب (${name}) بكود ${username}`, 'success');
      renderApp();
    }

    function renderBulkPreviewTableHTML(rows) {
      if (!rows || rows.length === 0) return '';
      const validCount = rows.filter(r => r.status === 'valid').length;
      const dupCount = rows.filter(r => r.status === 'duplicate').length;

      return `
        <div class="border border-slate-200 rounded-2xl overflow-hidden bg-slate-50/50">
          <div class="px-3 py-2 bg-slate-100 border-b border-slate-200 flex items-center justify-between text-[11px] font-bold">
            <span class="text-slate-700">معاينة فورية قبل الحفظ (${rows.length} صف)</span>
            <div class="flex items-center gap-2">
              <span class="text-emerald-700">صالح: ${validCount}</span>
              ${dupCount > 0 ? `<span class="text-rose-600">مكرر: ${dupCount}</span>` : ''}
            </div>
          </div>
          <div class="max-h-48 overflow-y-auto">
            <table class="w-full text-right text-[11px]">
              <thead class="bg-white text-slate-600 font-extrabold border-b border-slate-200 sticky top-0">
                <tr>
                  <th class="py-2 px-2">الاسم</th>
                  <th class="py-2 px-2 text-center">الكود</th>
                  <th class="py-2 px-2 text-center">كلمة المرور</th>
                  <th class="py-2 px-2 text-center">الحالة</th>
                </tr>
              </thead>
              <tbody class="divide-y divide-slate-100 bg-white">
                ${rows.map(r => `
                  <tr class="${r.status === 'duplicate' ? 'bg-rose-50/70' : ''}">
                    <td class="py-1.5 px-2 font-bold text-slate-800 truncate max-w-[130px]">${r.name}</td>
                    <td class="py-1.5 px-2 text-center font-mono font-bold ${r.codeSource === 'excel' ? 'text-brand-700' : 'text-slate-500'}">
                      ${r.username}
                      ${r.codeSource === 'auto' ? '<span class="text-[9px] block text-slate-400">(تلقائي)</span>' : ''}
                    </td>
                    <td class="py-1.5 px-2 text-center font-mono font-bold ${r.passSource === 'excel' ? 'text-emerald-700' : 'text-slate-500'}">
                      ${r.password}
                      ${r.passSource === 'auto' ? '<span class="text-[9px] block text-slate-400">(تلقائي)</span>' : ''}
                    </td>
                    <td class="py-1.5 px-2 text-center">
                      ${r.status === 'valid'
                        ? '<span class="px-1.5 py-0.5 rounded-full bg-emerald-100 text-emerald-800 font-bold text-[10px]">جاهز</span>'
                        : `<span class="px-1.5 py-0.5 rounded-full bg-rose-100 text-rose-700 font-bold text-[10px]">${r.statusNote}</span>`
                      }
                    </td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>
        </div>
      `;
    }

    function updateBulkPreview(val) {
      uiState.bulkRawText = val;
      refreshBulkPreviewDOM();
    }

    function refreshBulkPreviewDOM() {
      const container = document.getElementById('bulk-preview-container');
      const btn = document.getElementById('bulk-submit-btn');
      const rows = parseBulkStudentsInput(uiState.bulkRawText, uiState.selectedClassId, uiState.bulkPassMode);
      const validCount = rows.filter(r => r.status === 'valid').length;
      if (container) {
        container.innerHTML = renderBulkPreviewTableHTML(rows);
      }
      if (btn) {
        btn.innerHTML = `
          <i data-lucide="users" class="w-4 h-4"></i>
          <span>اعتماد وتسجيل الطلاب (${validCount > 0 ? validCount : 'القائمة'})</span>
        `;
        if (window.lucide) lucide.createIcons();
      }
    }

    function handleBulkCsvUpload(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(e) {
        uiState.bulkRawText = e.target.result || '';
        const textarea = document.getElementById('bulk-students-names');
        if (textarea) textarea.value = uiState.bulkRawText;
        refreshBulkPreviewDOM();
        showToast(`تم قراءة بيانات الملف (${file.name}) بنجاح`, 'success');
      };
      reader.readAsText(file, 'UTF-8');
    }

    function handleBulkImportStudents(e) {
      e.preventDefault();
      const rawText = document.getElementById('bulk-students-names').value;
      const passMode = document.getElementById('bulk-pass-mode').value;
      const parsedRows = parseBulkStudentsInput(rawText, uiState.selectedClassId, passMode);

      if (parsedRows.length === 0) {
        showToast('يرجى لصق بيانات طالب واحد على الأقل من Excel أو رفع ملف CSV', 'warning');
        return;
      }

      const validRows = parsedRows.filter(r => r.status === 'valid');
      const skippedCount = parsedRows.length - validRows.length;

      if (validRows.length === 0) {
        showToast('جميع الأكواد في القائمة مسجلة مسبقاً، يرجى مراجعة الجدول.', 'error');
        return;
      }

      validRows.forEach((row, idx) => {
        appData.students.push({
          id: `s_${Date.now()}_${idx}`,
          username: row.username,
          password: row.password,
          name: row.name,
          classId: uiState.selectedClassId
        });
      });

      uiState.bulkRawText = '';
      saveState();
      if (skippedCount > 0) {
        showToast(`تم تسجيل ${validRows.length} طالب بنجاح، وتخطي ${skippedCount} صف لتكرار الكود.`, 'warning');
      } else {
        showToast(`تم سحب وتسجيل ${validRows.length} طالب بأكوادهم وكلمات مرورهم بنجاح!`, 'success');
      }
      renderApp();
    }

    function confirmDeleteAllClassStudents() {
      const currentClass = appData.classes.find(c => c.id === uiState.selectedClassId) || appData.classes[0];
      const classStudents = appData.students.filter(s => s.classId === uiState.selectedClassId);
      if (classStudents.length === 0) return;

      openModal(`
        <div class="space-y-4 text-center">
          <div class="w-14 h-14 rounded-2xl bg-rose-100 text-rose-600 flex items-center justify-center mx-auto">
            <i data-lucide="alert-triangle" class="w-8 h-8"></i>
          </div>
          <div>
            <h3 class="font-extrabold text-slate-900 text-lg">تأكيد حذف جميع طلاب الفصل</h3>
            <p class="text-xs sm:text-sm text-slate-600 mt-1.5 leading-relaxed">
              هل أنت متأكد من رغبتك في حذف جميع الطلاب المسجلين في <strong>(${currentClass.fullName})</strong> وعددهم <strong>${classStudents.length}</strong> طالب؟
              <br />
              <span class="text-rose-600 font-bold">لن تتأثر بقية الفصول الأخرى بهذا الإجراء.</span>
            </p>
          </div>
          <div class="grid grid-cols-2 gap-2.5 pt-2">
            <button type="button" onclick="executeDeleteAllClassStudents()"
              class="py-3 bg-rose-600 hover:bg-rose-700 text-white font-bold rounded-2xl text-xs sm:text-sm transition flex items-center justify-center gap-1.5">
              <i data-lucide="trash-2" class="w-4 h-4"></i>
              <span>نعم، احذف الكل</span>
            </button>
            <button type="button" onclick="forceCloseModal()"
              class="py-3 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold rounded-2xl text-xs sm:text-sm transition">
              إلغاء الأمر
            </button>
          </div>
        </div>
      `);
    }

    function executeDeleteAllClassStudents() {
      const currentClass = appData.classes.find(c => c.id === uiState.selectedClassId) || appData.classes[0];
      const deletedStudentIds = new Set(
        appData.students.filter(s => s.classId === uiState.selectedClassId).map(s => s.id)
      );

      appData.students = appData.students.filter(s => s.classId !== uiState.selectedClassId);

      Object.keys(appData.grades).forEach(gradeKey => {
        const stId = gradeKey.split('_')[0];
        if (deletedStudentIds.has(stId)) {
          delete appData.grades[gradeKey];
        }
      });
      deletedStudentIds.forEach(stId => {
        delete appData.monthlyExams[stId];
      });
      Object.keys(appData.attendance).forEach(attKey => {
        if (attKey.startsWith(`${uiState.selectedClassId}_`)) {
          delete appData.attendance[attKey];
        }
      });

      saveState();
      forceCloseModal();
      showToast(`تم مسح جميع طلاب (${currentClass.fullName}) بنجاح`, 'info');
      renderApp();
    }

    function saveEditedStudent(e, studentId) {
      e.preventDefault();
      const name = document.getElementById('edit-st-name').value.trim();
      const classId = document.getElementById('edit-st-class').value;
      const username = document.getElementById('edit-st-user').value.trim();
      const password = document.getElementById('edit-st-pass').value.trim();

      if (appData.students.some(s => s.username === username && s.id !== studentId) || username === appData.settings.teacherUsername) {
        showToast('اسم المستخدم مكرر لطالب آخر أو للمعلم', 'error');
        return;
      }

      const idx = appData.students.findIndex(s => s.id === studentId);
      if (idx !== -1) {
        appData.students[idx] = { ...appData.students[idx], name, classId, username, password };
        saveState();
        forceCloseModal();
        showToast('تم تحديث بيانات الطالب بنجاح', 'success');
        renderApp();
      }
    }

    function deleteStudent(studentId) {
      appData.students = appData.students.filter(s => s.id !== studentId);
      saveState();
      showToast('تم حذف الطالب من القائمة', 'info');
      renderApp();

      return `

          <div class="lg:col-span-6 bg-white rounded-3xl p-5 sm:p-6 shadow-xs border border-slate-200 h-fit">
            <h2 class="text-lg font-extrabold text-slate-900 mb-1 flex items-center gap-2">

                <label class="block text-xs font-bold text-slate-700 mb-1.5">نوع المحتوى (التبويب عند الطالب)</label>

                  ${[
                    { id: 'classwork', label: 'الأداء الصفي', icon: 'book-open' },
                    { id: 'homework', label: 'الواجب المنزلي', icon: 'pen-tool' },
                    { id: 'quiz', label: 'التقييم الأسبوعي', icon: 'award' }
                  ].map(item => `
                    <button type="button" onclick="uiState.uploadType='${item.id}'; renderApp();"
                      class="p-2.5 rounded-2xl border text-xs font-bold flex flex-col items-center gap-1 transition ${
                        uiState.uploadType === item.id
                          ? 'bg-brand-50 border-brand-600 text-brand-800 shadow-xs'
                          : 'bg-slate-50 border-slate-200 text-slate-600 hover:bg-slate-100'
                      }">
                      <i data-lucide="${item.icon}" class="w-4 h-4"></i>
                      <span>${item.label}</span>
                    </button>
                  `).join('')}
                </div>
              </div>

              <div>
                <label class="block text-xs font-bold text-slate-700 mb-1.5">التاريخ</label>
                <input id="upload-date" type="date" required value="${uiState.uploadDate}"
                  onchange="uiState.uploadDate=this.value"
                  class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-2xl text-sm font-bold text-slate-800 focus:outline-none focus:ring-2 focus:ring-brand-600" />
              </div>

              <div>
                <label class="block text-xs font-bold text-slate-700 mb-1.5">عنوان الدرس / الواجب / التقييم</label>
                <input id="upload-title" type="text" required placeholder="مثال: شرح الحلقات التكرارية For Loop في بايثون"
                  class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-2xl text-sm font-semibold focus:outline-none focus:ring-2 focus:ring-brand-600" />
              </div>

              <div>
                <label class="block text-xs font-bold text-slate-700 mb-1.5">التفاصيل والتعليمات للطلاب</label>
                <textarea id="upload-desc" rows="3" required placeholder="اكتب ملخص ما تم شرحه أو المطلوب في الواجب المنزلي..."
                  class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-2xl text-sm focus:outline-none focus:ring-2 focus:ring-brand-600"></textarea>
              </div>

              <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                <div>
                  <label class="block text-xs font-bold text-slate-700 mb-1.5">إرفاق صورة للمعاينة</label>
                  <label class="flex items-center justify-center gap-2 p-2.5 border-2 border-dashed border-slate-300 hover:border-brand-500 rounded-2xl cursor-pointer bg-slate-50 hover:bg-brand-50/40 transition text-xs font-bold text-slate-600">
                    <i data-lucide="image" class="w-4 h-4 text-brand-700 shrink-0"></i>
                    <span class="truncate">${uiState.uploadAttachment ? uiState.uploadAttachment.name : 'اختر صورة من جهازك'}</span>
                    <input type="file" accept="image/*" class="hidden" onchange="handleFileSelect(event)" />
                  </label>
                </div>
                <div>
                  <label class="block text-xs font-bold text-slate-700 mb-1.5">رابط ملف PDF (اختياري)</label>
                  <input id="upload-pdf-url" type="url" placeholder="https://example.com/file.pdf"
                    class="w-full px-3 py-2.5 bg-slate-50 border border-slate-200 rounded-2xl text-xs font-semibold focus:outline-none focus:ring-2 focus:ring-brand-600" />
                </div>
              </div>

              <button type="submit"
                class="w-full py-3.5 bg-brand-700 hover:bg-brand-800 text-white font-bold rounded-2xl shadow-md transition flex items-center justify-center gap-2 text-sm">
                <i data-lucide="send" class="w-4 h-4"></i>
                <span>نشر المحتوى للطلاب الآن</span>
              </button>
            </form>
          </div>

          <div class="lg:col-span-6 space-y-3">
            <div class="flex items-center justify-between px-1">
              <h3 class="font-extrabold text-slate-800 text-base">المحتوى المرفوع لـ (${currentClass.fullName})</h3>
              <span class="text-xs font-bold bg-slate-200 text-slate-700 px-2.5 py-1 rounded-full">${classContents.length} عناصر</span>
            </div>

            ${classContents.length === 0 ? `
              <div class="bg-white rounded-3xl p-8 text-center border border-slate-200 text-slate-500 text-sm">
                لا يوجد محتوى مرفوع لهذا الفصل بعد.
              </div>
            ` : classContents.map(item => {
              const meta = getTypeLabel(item.type);
              return `
                <div class="bg-white rounded-2xl p-4 shadow-xs border border-slate-200 flex items-start justify-between gap-3">
                  <div class="space-y-1.5">
                    <div class="flex flex-wrap items-center gap-2">
                      <span class="px-2.5 py-0.5 rounded-full text-[11px] font-bold ${meta.badge}">${meta.label}</span>
                      <span class="text-xs font-bold text-slate-500 flex items-center gap-1">
                        <i data-lucide="calendar" class="w-3.5 h-3.5"></i>
                        ${item.date}
                      </span>
                    </div>
                    <h4 class="font-bold text-slate-900 text-sm">${item.title}</h4>
                    <p class="text-xs text-slate-600 line-clamp-2">${item.description}</p>
                    ${(item.attachmentName || item.attachmentUrl) ? `
                      <div class="inline-flex items-center gap-1 text-[11px] font-bold text-brand-700 bg-brand-50 px-2 py-0.5 rounded-lg">
                        <i data-lucide="paperclip" class="w-3 h-3"></i>
                        <span>${item.attachmentName || 'رابط ملف PDF'}</span>
                      </div>
                    ` : ''}
                  </div>
                  <button onclick="deleteContent('${item.id}')" title="حذف المحتوى"
                    class="p-2 text-slate-400 hover:text-rose-600 hover:bg-rose-50 rounded-xl transition shrink-0">
                    <i data-lucide="trash-2" class="w-4 h-4"></i>
                  </button>
                </div>
              `;
            }).join('')}
          </div>
        </div>
      `;
    }

    function handleFileSelect(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(e) {
        uiState.uploadAttachment = {
          name: file.name,
          type: 'image',
          preview: e.target.result
        };
        renderApp();
      };
      reader.readAsDataURL(file);
    }

    function handleContentSubmit(e) {
      e.preventDefault();
      const title = document.getElementById('upload-title').value.trim();
      const description = document.getElementById('upload-desc').value.trim();
      const date = document.getElementById('upload-date').value;
      const pdfUrl = document.getElementById('upload-pdf-url').value.trim();

      let attachmentName = '';
      let attachmentType = 'none';
      let attachmentPreview = null;

      if (uiState.uploadAttachment) {
        attachmentName = uiState.uploadAttachment.name;
        attachmentType = 'image';
        attachmentPreview = uiState.uploadAttachment.preview;
      } else if (pdfUrl) {
        attachmentName = 'ملف PDF مرفق';
        attachmentType = 'pdf';
      }

      const newContent = {
        id: 'cnt_' + Date.now(),
        classId: uiState.selectedClassId,
        type: uiState.uploadType,
        date: date,
        title: title,
        description: description,
        attachmentName,
        attachmentType,
        attachmentUrl: pdfUrl,
        attachmentPreview,
        createdAt: new Date().toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' })
      };

      appData.contents.unshift(newContent);
      uiState.uploadAttachment = null;
      saveState();
      showToast('تم نشر المحتوى بنجاح وسيظهر للطلاب فوراً!', 'success');
      renderApp();
    }

    function deleteContent(id) {
      appData.contents = appData.contents.filter(c => c.id !== id);
      saveState();
      showToast('تم حذف المحتوى', 'info');
      renderApp();
    }

    /* -----------------------------------------------------------------------
     * الغياب والحضور اليومي + طباعة كشف الغياب الأسبوعي (الأحد - الخميس)
     * ----------------------------------------------------------------------- */
    function renderTeacherAttendanceTab() {
      const classStudents = sortStudentsAlphabetically(
        appData.students.filter(s => s.classId === uiState.selectedClassId)
      );
      const attKey = `${uiState.selectedClassId}_${uiState.attendanceDate}`;
      const dayRecords = appData.attendance[attKey] || {};

      let presentCount = 0, absentCount = 0, excusedCount = 0;
      classStudents.forEach(s => {
        const status = dayRecords[s.id] || 'present';
        if (status === 'present') presentCount++;
        else if (status === 'absent') absentCount++;
        else if (status === 'excused') excusedCount++;
      });

      return `
        <div class="bg-white rounded-3xl p-5 sm:p-6 shadow-xs border border-slate-200 space-y-5">
          <div class="flex flex-wrap items-center justify-between gap-3 border-b border-slate-100 pb-4">
            <div>
              <h2 class="text-lg font-extrabold text-slate-900">سجل الحضور والغياب اليومي (ترتيب أبجدي)</h2>
              <p class="text-xs text-slate-500">يُربط الغياب تلقائياً بكشف الغياب الأسبوعي (من الأحد إلى الخميس) للطباعة.</p>
            </div>

            <div class="flex flex-wrap items-center gap-2">
              <div class="flex items-center gap-1.5 bg-slate-50 border border-slate-200 rounded-xl px-2.5 py-1.5">
                <label class="text-xs font-bold text-slate-600">التاريخ:</label>
                <input type="date" value="${uiState.attendanceDate}"
                  onchange="uiState.attendanceDate=this.value; renderApp();"
                  class="bg-transparent text-xs sm:text-sm font-bold text-brand-800 focus:outline-none" />
              </div>

              <select onchange="uiState.selectedAttSheetId=this.value;"
                class="bg-amber-50 text-amber-950 border border-amber-300 rounded-xl px-3 py-2 text-xs font-extrabold">
                ${ATTENDANCE_SHEETS_CONFIG.map(sh => `
                  <option value="${sh.id}" ${uiState.selectedAttSheetId === sh.id ? 'selected' : ''}>كشف غياب: ${sh.label}</option>
                `).join('')}
              </select>

              <button type="button" onclick="openWeeklyAttendancePrintModal()"
                class="px-3.5 py-2 bg-brand-700 hover:bg-brand-800 text-white text-xs font-extrabold rounded-xl flex items-center gap-1.5 shadow-xs transition">
                <i data-lucide="printer" class="w-4 h-4"></i>
                <span>طباعة كشف الغياب الأسبوعي</span>
              </button>
            </div>
          </div>

          <div class="grid grid-cols-3 gap-3">
            <div class="bg-emerald-50 border border-emerald-200 rounded-2xl p-3 text-center">
              <div class="text-xl font-extrabold text-emerald-700">${presentCount}</div>
              <div class="text-xs font-bold text-emerald-800">حاضر</div>
            </div>
            <div class="bg-rose-50 border border-rose-200 rounded-2xl p-3 text-center">
              <div class="text-xl font-extrabold text-rose-700">${absentCount}</div>
              <div class="text-xs font-bold text-rose-800">غائب</div>
            </div>
            <div class="bg-amber-50 border border-amber-200 rounded-2xl p-3 text-center">
              <div class="text-xl font-extrabold text-amber-700">${excusedCount}</div>
              <div class="text-xs font-bold text-amber-800">بعذر</div>
            </div>
          </div>

          ${classStudents.length === 0 ? `
            <div class="p-8 text-center border border-dashed border-slate-300 rounded-2xl text-slate-500 text-xs">
              لا يوجد طلاب مسجلون في هذا الفصل لرصد حضورهم.
            </div>
          ` : `
            <div class="divide-y divide-slate-100">
              ${classStudents.map((student, idx) => {
                const status = dayRecords[student.id] || 'present';
                const stats = getStudentAttendanceStats(student.id, uiState.selectedClassId);
                return `
                  <div class="py-3.5 flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                    <div class="flex items-center gap-3">
                      <span class="w-7 h-7 rounded-lg bg-slate-100 text-slate-600 text-xs font-bold flex items-center justify-center shrink-0">
                        ${idx + 1}
                      </span>
                      <div>
                        <div class="font-bold text-slate-900 text-sm">${student.name}</div>
                        <div class="text-[11px] text-slate-500 flex items-center gap-2 mt-0.5">
                          <span>كود: ${student.username}</span>
                          <span class="${stats.absent > 0 ? 'text-rose-600 font-bold' : 'text-slate-400'}">• إجمالي الغياب: ${stats.absent} يوم</span>
                        </div>
                      </div>
                    </div>

                    <div class="grid grid-cols-3 gap-1.5 sm:w-64">
                      <button type="button" onclick="setStudentAttendance('${student.id}', 'present')"
                        class="py-2 px-2 rounded-xl text-xs font-bold border transition ${
                          status === 'present'
                            ? 'bg-emerald-600 text-white border-emerald-600 shadow-xs'
                            : 'bg-slate-50 text-slate-600 border-slate-200 hover:bg-emerald-50'
                        }">حاضر</button>
                      <button type="button" onclick="setStudentAttendance('${student.id}', 'absent')"
                        class="py-2 px-2 rounded-xl text-xs font-bold border transition ${
                          status === 'absent'
                            ? 'bg-rose-600 text-white border-rose-600 shadow-xs'
                            : 'bg-slate-50 text-slate-600 border-slate-200 hover:bg-rose-50'
                        }">غائب</button>
                      <button type="button" onclick="setStudentAttendance('${student.id}', 'excused')"
                        class="py-2 px-2 rounded-xl text-xs font-bold border transition ${
                          status === 'excused'
                            ? 'bg-amber-500 text-white border-amber-500 shadow-xs'
                            : 'bg-slate-50 text-slate-600 border-slate-200 hover:bg-amber-50'
                        }">بعذر</button>
                    </div>
                  </div>
                `;
              }).join('')}
            </div>

            <div class="pt-2">
              <button onclick="saveAttendanceConfirmed()"
                class="w-full sm:w-auto px-6 py-3 bg-brand-700 hover:bg-brand-800 text-white font-bold rounded-2xl shadow-md transition flex items-center justify-center gap-2 text-sm">
                <i data-lucide="save" class="w-4 h-4"></i>
                <span>حفظ سجل الحضور لتاريخ ${uiState.attendanceDate}</span>
              </button>
            </div>
          `}
        </div>
      `;
    }

    function setStudentAttendance(studentId, status) {
      const attKey = `${uiState.selectedClassId}_${uiState.attendanceDate}`;
      if (!appData.attendance[attKey]) {
        appData.attendance[attKey] = {};
      }
      const classStudents = appData.students.filter(s => s.classId === uiState.selectedClassId);
      classStudents.forEach(s => {
        if (!appData.attendance[attKey][s.id]) {
          appData.attendance[attKey][s.id] = 'present';
        }
      });
      appData.attendance[attKey][studentId] = status;
      saveState();
      renderApp();
    }

    function saveAttendanceConfirmed() {
      const attKey = `${uiState.selectedClassId}_${uiState.attendanceDate}`;
      if (!appData.attendance[attKey]) appData.attendance[attKey] = {};
      const classStudents = appData.students.filter(s => s.classId === uiState.selectedClassId);
      classStudents.forEach(s => {
        if (!appData.attendance[attKey][s.id]) {
          appData.attendance[attKey][s.id] = 'present';
        }
      });
      saveState();
      showToast(`تم حفظ الحضور والغياب ليوم ${uiState.attendanceDate} وربطه بكشف الغياب الأسبوعي`, 'success');
      renderApp();
    }

    function openWeeklyAttendancePrintModal() {
      const activeAttSheet = ATTENDANCE_SHEETS_CONFIG.find(a => a.id === uiState.selectedAttSheetId) || ATTENDANCE_SHEETS_CONFIG[0];
      const s = appData.settings;
      const profile = getActiveTeacherProfile();
      const currentClass = appData.classes.find(c => c.id === uiState.selectedClassId) || appData.classes[0];
      const classStudents = sortStudentsAlphabetically(
        appData.students.filter(st => st.classId === uiState.selectedClassId)
      );

      const weeksData = activeAttSheet.weeks.map(wNum => ({
        num: wNum,
        label: getArabicWeekOrdinal(wNum),
        days: getWeekSundayToThursdayDays(s.studyStartDate, wNum)
      }));

      openModal(`
        <div class="space-y-4" dir="rtl">
          <div class="flex flex-wrap items-center justify-between gap-2 border-b border-slate-200 pb-3">
            <div>
              <h3 class="font-extrabold text-slate-900 text-base">كشف الغياب الأسبوعي الرسمي (من الأحد إلى الخميس)</h3>
              <p class="text-xs text-slate-500">مرتبط تلقائياً برصد الغياب اليومي • اتجاه النص عمودي مريح للخانات الرفيعة.</p>
            </div>
            <div class="flex flex-wrap items-center gap-2">
              <select onchange="uiState.selectedAttSheetId=this.value; openWeeklyAttendancePrintModal();"
                class="bg-amber-50 text-amber-950 border border-amber-300 rounded-xl px-3 py-1.5 text-xs font-extrabold">
                ${ATTENDANCE_SHEETS_CONFIG.map(sh => `
                  <option value="${sh.id}" ${uiState.selectedAttSheetId === sh.id ? 'selected' : ''}>${sh.label}</option>
                `).join('')}
              </select>
              <button type="button" onclick="triggerImmediatePrint()"
                class="px-4 py-2 bg-brand-700 hover:bg-brand-800 text-white text-xs font-extrabold rounded-xl flex items-center gap-1.5 shadow-sm">
                <i data-lucide="printer" class="w-4 h-4"></i>
                <span>طباعة الكشف الآن</span>
              </button>
              <button type="button" onclick="forceCloseModal()" class="p-2 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700">
                <i data-lucide="x" class="w-4 h-4"></i>
              </button>
            </div>
          </div>

          <div id="printable-sheet-box" class="border-2 border-slate-900 rounded-xl p-3 bg-white text-slate-950">
            <div style="display:flex;justify-content:space-between;align-items:flex-start;border-bottom:2px solid #0f172a;padding-bottom:6px;margin-bottom:8px;gap:8px;">
              <div style="font-size:10px;font-weight:900;line-height:1.4;text-align:right;">
                <div>${s.directorate}</div>
                <div>${s.administration}</div>
                <div>${s.schoolName}</div>
              </div>
              <div style="text-align:center;flex:1;">
                <div style="font-size:12px;font-weight:900;border:1px solid #0f172a;border-radius:8px;padding:3px 10px;display:inline-block;background:#f8fafc;">
                  سجل متابعة الحضور والغياب — ${currentClass.fullName} (${currentClass.gradeLevel || s.gradeLevel})
                </div>
                <div style="font-size:9px;font-weight:700;color:#475569;margin-top:2px;">
                  ${activeAttSheet.rangeTitle} • مادة ${profile ? profile.subjectName : s.subjectName} • العام الدراسي ${s.academicYear}
                </div>
              </div>
              <div style="font-size:9.5px;font-weight:800;text-align:left;">
                <div>عدد الطلاب: ${classStudents.length}</div>
                <div>الرمز: (غ) غائب • (ع) بعذر</div>
              </div>
            </div>

            <div style="overflow-x:auto;">
              <table class="official-sheet" style="width:100%;border-collapse:collapse;text-align:center;font-size:8px;">
                <thead>
                  <tr style="background:#f1f5f9;font-weight:900;">
                    <th rowspan="2" style="border:1px solid #0f172a;padding:2px;width:22px;">م</th>
                    <th rowspan="2" style="border:1px solid #0f172a;padding:2px 4px;text-align:right;min-width:110px;">اسم الطالب</th>
                    ${weeksData.map((w, wIdx) => `
                      <th colspan="5" style="border:1px solid #0f172a;padding:3px 1px;${wIdx > 0 ? 'border-right:2.5px solid #000;' : ''}">
                        ${w.label}
                      </th>
                    `).join('')}
                    <th rowspan="2" style="border:1px solid #0f172a;border-right:2.5px solid #000;padding:2px;width:28px;background:#fee2e2;">إجمالي الغياب</th>
                  </tr>
                  <tr style="background:#f8fafc;font-weight:800;font-size:7px;">
                    ${weeksData.map((w, wIdx) => w.days.map((d, dIdx) => `
                      <th style="border:1px solid #0f172a;padding:3px 0;width:19px;height:56px;vertical-align:middle;${wIdx > 0 && dIdx === 0 ? 'border-right:2.5px solid #000;' : ''}">
                        <div class="vertical-header-cell">${d.dayName} ${d.shortDate}</div>
                      </th>
                    `).join('')).join('')}
                  </tr>
                </thead>
                <tbody>
                  ${classStudents.length === 0 ? `
                    <tr><td colspan="30" style="border:1px solid #0f172a;padding:12px;">لا يوجد طلاب مسجلون في هذا الفصل</td></tr>
                  ` : classStudents.map((st, idx) => {
                    let sheetAbsentCount = 0;
                    const dayCells = weeksData.map((w, wIdx) => w.days.map((d, dIdx) => {
                      const recKey = `${currentClass.id}_${d.isoDate}`;
                      const dayMap = appData.attendance[recKey] || {};
                      const status = dayMap[st.id];
                      let symbol = '';
                      let bg = '#ffffff';
                      let color = '#0f172a';
                      if (status === 'absent') {
                        symbol = 'غ';
                        bg = '#fee2e2';
                        color = '#b91c1c';
                        sheetAbsentCount++;
                      } else if (status === 'excused') {
                        symbol = 'ع';
                        bg = '#fef3c7';
                        color = '#b45309';
                      } else if (status === 'present') {
                        symbol = '✓';
                        color = '#15803d';
                      }
                      return `
                        <td style="border:1px solid #0f172a;padding:1px 0;width:19px;font-weight:900;background:${bg};color:${color};${wIdx > 0 && dIdx === 0 ? 'border-right:2.5px solid #000;' : ''}">
                          ${symbol}
                        </td>
                      `;
                    }).join('')).join('');

                    return `
                      <tr>
                        <td style="border:1px solid #0f172a;font-weight:800;">${idx + 1}</td>
