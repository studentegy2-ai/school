    function updateOfficialSheetGrade(studentId, week, field, rawValue, maxLimit, inputEl) {
      const key = `${studentId}_${week}`;
      if (!appData.grades[key]) {
        appData.grades[key] = { quiz: null, hw: null, behavior: null };
      }

      const tok = parseGradeToken(rawValue);
      if (tok.type === 'empty') {
        appData.grades[key][field] = null;
        inputEl.classList.remove('text-rose-600');
        inputEl.classList.add('text-slate-900');
        saveState();
        refreshSheetRowCalculations(studentId, week);
        return;
      }

      if (tok.type === 'invalid') {
        showToast('قيمة غير صالحة؛ يُسمح بإدخال رقم أو كلمة "صفر" أو حرف "غ"', 'error');
        const prev = parseGradeToken(appData.grades[key][field]);
        inputEl.value = prev.display;
        return;
      }

      if (tok.type === 'absent') {
        appData.grades[key][field] = 'غ';
        inputEl.value = 'غ';
        inputEl.classList.remove('text-slate-900');
        inputEl.classList.add('text-rose-600');
        saveState();
        refreshSheetRowCalculations(studentId, week);
        return;
      }

      if (tok.num < 0) {
        showToast('لا يمكن إدخال درجة أقل من صفر', 'error');
        const prev = parseGradeToken(appData.grades[key][field]);
        inputEl.value = prev.display;
        return;
      }

      if (tok.num > maxLimit) {
        showToast(`الحد الأقصى لهذه الخانة هو ${maxLimit} درجة!`, 'error');
        const prev = parseGradeToken(appData.grades[key][field]);
        inputEl.value = prev.display;
        return;
      }

      const trimmed = String(rawValue).trim();
      const storedVal = trimmed === 'صفر' ? 'صفر' : tok.num;
      appData.grades[key][field] = storedVal;
      inputEl.value = storedVal;
      inputEl.classList.remove('text-rose-600');
      inputEl.classList.add('text-slate-900');
      saveState();
      refreshSheetRowCalculations(studentId, week);
    }

    function updateMonthlyExam(studentId, examKey, rawValue, inputEl) {
      if (!appData.monthlyExams[studentId]) {
        appData.monthlyExams[studentId] = { oct: null, nov: null };
      }

      const tok = parseGradeToken(rawValue);
      if (tok.type === 'empty') {
        appData.monthlyExams[studentId][examKey] = null;
        inputEl.classList.remove('text-rose-600');
        inputEl.classList.add('text-slate-900');
        saveState();
        refreshMonthlyExamTotalDOM(studentId);
        return;
      }

      if (tok.type === 'invalid') {
        showToast('قيمة غير صالحة؛ يُسمح بإدخال رقم أو "صفر" أو "غ"', 'error');
        const prev = parseGradeToken(appData.monthlyExams[studentId][examKey]);
        inputEl.value = prev.display;
        return;
      }

      if (tok.type === 'absent') {
        appData.monthlyExams[studentId][examKey] = 'غ';
        inputEl.value = 'غ';
        inputEl.classList.remove('text-slate-900');
        inputEl.classList.add('text-rose-600');
        saveState();
        refreshMonthlyExamTotalDOM(studentId);
        return;
      }

      if (tok.num < 0 || tok.num > 15) {
        showToast('الحد الأقصى لاختبار الشهر هو 15 درجة!', 'error');
        const prev = parseGradeToken(appData.monthlyExams[studentId][examKey]);
        inputEl.value = prev.display;
        return;
      }

      const trimmed = String(rawValue).trim();
      const storedVal = trimmed === 'صفر' ? 'صفر' : tok.num;
      appData.monthlyExams[studentId][examKey] = storedVal;
      inputEl.value = storedVal;
      inputEl.classList.remove('text-rose-600');
      inputEl.classList.add('text-slate-900');
      saveState();
      refreshMonthlyExamTotalDOM(studentId);
    }

    function refreshSheetRowCalculations(studentId, week) {
      const weekCell = document.getElementById(`sheet-total-${studentId}-${week}`);
      if (weekCell) {
        const rec = appData.grades[`${studentId}_${week}`] || { quiz: null, hw: null, behavior: null };
        const qTok = parseGradeToken(rec.quiz);
        const hTok = parseGradeToken(rec.hw);
        const bTok = parseGradeToken(rec.behavior);
        const hasAny = qTok.type !== 'empty' || hTok.type !== 'empty' || bTok.type !== 'empty';
        const sum = Number((qTok.num + hTok.num + bTok.num).toFixed(2));
        weekCell.textContent = hasAny ? sum : '-';
      }

      const avgQuizEl = document.getElementById(`term-avg-quiz-${studentId}`);
      if (avgQuizEl) {
        const summary = calculateStudentTermSummary(studentId);
        avgQuizEl.textContent = summary.quizCount > 0 ? summary.quizAvg : '-';
        const avgHwEl = document.getElementById(`term-avg-hw-${studentId}`);
        const avgBehEl = document.getElementById(`term-avg-beh-${studentId}`);
        const avgTotEl = document.getElementById(`term-avg-total-${studentId}`);
        if (avgHwEl) avgHwEl.textContent = summary.hwCount > 0 ? summary.hwAvg : '-';
        if (avgBehEl) avgBehEl.textContent = summary.behCount > 0 ? summary.behAvg : '-';
        if (avgTotEl) avgTotEl.textContent = summary.hasAnyGrade ? summary.totalFinal : '-';
      }
    }

    function refreshMonthlyExamTotalDOM(studentId) {
      const totalEl = document.getElementById(`exams-total-${studentId}`);
      if (!totalEl) return;
      const summary = calculateStudentTermSummary(studentId);
      totalEl.textContent = summary.hasAnyExam ? summary.examsTotal : '-';
    }

    function exportOfficialSheetCSV(weekNumbers, includeTermAvgAndExams) {
      const s = appData.settings;
      const profile = getActiveTeacherProfile();
      const currentClass = appData.classes.find(c => c.id === uiState.selectedClassId) || appData.classes[0];
      const classStudents = sortStudentsAlphabetically(
        appData.students.filter(st => st.classId === uiState.selectedClassId)
      );

      const weekGroupCells = weekNumbers.map(w => {
        const wDate = getWeekSaturdayDate(s.studyStartDate, w);
        return `<th colspan="4" style="background:#dbeafe;border:1.5px solid #0f172a;padding:6px;">${getArabicWeekOrdinal(w)} (${wDate})</th>`;
      }).join('');

      const subHeaderCells = weekNumbers.map(() => `
        <th style="background:#f1f5f9;border:1px solid #0f172a;padding:5px;">تقييم أسبوعي (15)</th>
        <th style="background:#f1f5f9;border:1px solid #0f172a;padding:5px;">كراس الواجب (15)</th>
        <th style="background:#f1f5f9;border:1px solid #0f172a;padding:5px;">المواظبة والسلوك (10)</th>
        <th style="background:#e2e8f0;border:1.5px solid #0f172a;padding:5px;font-weight:bold;">المجموع (40)</th>
      `).join('');

      const extraGroupHeaders = includeTermAvgAndExams ? `
        <th colspan="4" style="background:#d1fae5;border:1.5px solid #0f172a;padding:6px;">متوسط الفصل الدراسي الأول</th>
        <th colspan="3" style="background:#fef3c7;border:1.5px solid #0f172a;padding:6px;">اختبارات الشهور</th>
      ` : '';

      const extraSubHeaders = includeTermAvgAndExams ? `
        <th style="background:#ecfdf5;border:1px solid #0f172a;padding:5px;">متوسط التقييم (15)</th>
        <th style="background:#ecfdf5;border:1px solid #0f172a;padding:5px;">متوسط الواجب (15)</th>
        <th style="background:#ecfdf5;border:1px solid #0f172a;padding:5px;">متوسط السلوك (10)</th>
        <th style="background:#a7f3d0;border:1.5px solid #0f172a;padding:5px;">المجموع (40)</th>
        <th style="background:#fffbeb;border:1px solid #0f172a;padding:5px;">اختبار أكتوبر (15)</th>
        <th style="background:#fffbeb;border:1px solid #0f172a;padding:5px;">اختبار نوفمبر (15)</th>
        <th style="background:#fde68a;border:1.5px solid #0f172a;padding:5px;">مجموع الاختبارين (30)</th>
      ` : '';

      const bodyRows = classStudents.map((st, idx) => {
        const wCells = weekNumbers.map(w => {
          const rec = appData.grades[`${st.id}_${w}`] || { quiz: null, hw: null, behavior: null };
          const qTok = parseGradeToken(rec.quiz);
          const hTok = parseGradeToken(rec.hw);
          const bTok = parseGradeToken(rec.behavior);
          const hasAny = qTok.type !== 'empty' || hTok.type !== 'empty' || bTok.type !== 'empty';
          const sum = hasAny ? Number((qTok.num + hTok.num + bTok.num).toFixed(2)) : '';
          return `
            <td style="border:1px solid #0f172a;text-align:center;padding:5px;">${qTok.display}</td>
            <td style="border:1px solid #0f172a;text-align:center;padding:5px;">${hTok.display}</td>
            <td style="border:1px solid #0f172a;text-align:center;padding:5px;">${bTok.display}</td>
            <td style="border:1.5px solid #0f172a;text-align:center;padding:5px;background:#f8fafc;font-weight:bold;">${sum}</td>
          `;
        }).join('');

        let extraCells = '';
        if (includeTermAvgAndExams) {
          const sum = calculateStudentTermSummary(st.id);
          extraCells = `
            <td style="border:1px solid #0f172a;text-align:center;padding:5px;background:#ecfdf5;">${sum.quizCount > 0 ? sum.quizAvg : ''}</td>
            <td style="border:1px solid #0f172a;text-align:center;padding:5px;background:#ecfdf5;">${sum.hwCount > 0 ? sum.hwAvg : ''}</td>
            <td style="border:1px solid #0f172a;text-align:center;padding:5px;background:#ecfdf5;">${sum.behCount > 0 ? sum.behAvg : ''}</td>
            <td style="border:1.5px solid #0f172a;text-align:center;padding:5px;background:#a7f3d0;font-weight:bold;">${sum.hasAnyGrade ? sum.totalFinal : ''}</td>
            <td style="border:1px solid #0f172a;text-align:center;padding:5px;background:#fffbeb;">${sum.octVal !== null ? sum.octVal : ''}</td>
            <td style="border:1px solid #0f172a;text-align:center;padding:5px;background:#fffbeb;">${sum.novVal !== null ? sum.novVal : ''}</td>
            <td style="border:1.5px solid #0f172a;text-align:center;padding:5px;background:#fde68a;font-weight:bold;">${sum.hasAnyExam ? sum.examsTotal : ''}</td>
          `;
        }

        return `
          <tr>
            <td style="border:1px solid #0f172a;text-align:center;padding:6px;font-weight:bold;">${idx + 1}</td>
            <td style="border:1.5px solid #0f172a;text-align:right;padding:6px 10px;font-weight:bold;white-space:nowrap;">${st.name}</td>
            ${wCells}
            ${extraCells}
          </tr>
        `;
      }).join('');

      const totalCols = 2 + weekNumbers.length * 4 + (includeTermAvgAndExams ? 7 : 0);
      const excelHtml = `
        <html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:x="urn:schemas-microsoft-com:office:excel" xmlns="http://www.w3.org/TR/REC-html40" dir="rtl">
        <head><meta charset="UTF-8" /></head>
        <body style="font-family:Arial, sans-serif;direction:rtl;">
          <table style="border-collapse:collapse;width:100%;">
            <tr>
              <th colspan="${totalCols}" style="font-size:14pt;font-weight:bold;text-align:right;padding:6px;">
                ${s.directorate} - ${s.administration} - ${s.schoolName}
              </th>
            </tr>
            <tr>
              <th colspan="${totalCols}" style="font-size:13pt;font-weight:bold;text-align:center;padding:8px;background:#eff6ff;border:1.5px solid #0f172a;">
                سجل رصد درجات ${currentClass.fullName} (${currentClass.gradeLevel || s.gradeLevel}) — مادة ${profile ? profile.subjectName : s.subjectName} — العام الدراسي ${s.academicYear}
              </th>
            </tr>
            <tr>
              <th rowspan="2" style="background:#e2e8f0;border:1.5px solid #0f172a;padding:6px;width:40px;">م</th>
              <th rowspan="2" style="background:#e2e8f0;border:1.5px solid #0f172a;padding:6px;width:240px;text-align:right;">اسم الطالب</th>
              ${weekGroupCells}
              ${extraGroupHeaders}
            </tr>
            <tr>
              ${subHeaderCells}
              ${extraSubHeaders}
            </tr>
            ${bodyRows}
            <tr><td colspan="${totalCols}" style="height:16px;"></td></tr>
            <tr>
              <td colspan="2" style="font-weight:bold;font-size:12pt;text-align:right;padding:6px;">معلم المادة / ${profile ? profile.name : s.teacherName}</td>
              <td colspan="${Math.max(1, totalCols - 2)}" style="font-weight:bold;font-size:12pt;text-align:left;padding:6px;">مدير المدرسة / ${s.principalName}</td>
            </tr>
          </table>
        </body>
        </html>
      `;

      const blob = new Blob(['\uFEFF' + excelHtml], { type: 'application/vnd.ms-excel;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.download = `كشف_درجات_${currentClass.name.replace('/', '-')}_أسبوع_${weekNumbers[0]}_إلى_${weekNumbers[weekNumbers.length - 1]}.xls`;
      link.click();
      URL.revokeObjectURL(url);
      showToast('تم تصدير ملف Excel المنسق بالجداول والألوان بنجاح', 'success');
    }

    /*************************************************************************
     * 8. نقطة التحديث الرئيسية للتطبيق
     *************************************************************************/
    function renderApp() {
      const root = document.getElementById('app');
      if (!root) return;
      if (!uiState.currentUser) {
        root.innerHTML = renderLoginScreen();
      } else if (uiState.currentUser.role === 'student') {
        root.innerHTML = renderStudentPortal();
      } else {
        root.innerHTML = renderTeacherPortal();
      }
      if (window.lucide) {
        lucide.createIcons();
      }
      if (window.cloudSync && typeof window.cloudSync.updateStatusBadge === 'function') {
        window.cloudSync.updateStatusBadge(window.cloudSync.enabled ? 'synced' : 'local');
      }
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', renderApp);
    } else {
      renderApp();
    }
  </script>
</body>
</html>
